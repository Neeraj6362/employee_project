services:
  mysql:
    image: mysql:8.0
    container_name: employee_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: employees_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee_api
    environment:
      DB_HOST: mysql
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: employees_db
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee_ui
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: on-failure

volumes:
  mysql_data: